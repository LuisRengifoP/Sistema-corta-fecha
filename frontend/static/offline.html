<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexion · Corta Fecha</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f8fafc;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --brand: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b1220;
          --surface: #111827;
          --ink: #e2e8f0;
          --muted: #94a3b8;
          --line: #1f2937;
          --brand: #3b82f6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .tarjeta {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        padding: 10px 20px;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <img src="/icons/marca-192.png" alt="" />
      <h1>Sin conexion</h1>
      <p>
        Esta pantalla no esta guardada en el dispositivo. Vuelve a intentarlo cuando recuperes la
        conexion; las pantallas que ya visitaste siguen disponibles.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
